name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.16', '5.32', '5.40']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: perl -V
        run: perl -V
      - name: Install OpenSSL headers for Feersum TLS
        run: sudo apt-get update -q && sudo apt-get install -y -q libssl-dev
      - name: Install dependencies
        run: |
          cpanm --notest --quiet 'Feersum~1.507'
          cpanm --notest --quiet --installdeps .
      - name: Build
        run: perl Makefile.PL && make
      - name: Test
        run: make test TEST_VERBOSE=1
      - name: Test the distribution built from MANIFEST
        run: make disttest
